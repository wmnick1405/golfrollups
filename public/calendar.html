<!DOCTYPE html>
<html>
<!-- Club Calendar - This is the main page for viewing club events and activities -->
<head>
    <title>Club Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="js/shared.js" defer></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            flex-wrap: wrap;
            gap: 15px;
        }

        /* Search Bar Styling */

        .search-row {
            display: flex !important;
            flex-direction: row;
            align-items: stretch;
            gap: 10px;
            margin-bottom: 25px;
            width: 100%;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 0;
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid #ddd;
            font-size: 16px;
            outline: none;
        }

        .filter-input {
            padding: 0 14px;
            border: 1px solid #ddd;
            border-radius: 50px;
            min-height: 46px;
            background: white;
        }

        .search-input:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 8px rgba(46, 125, 50, 0.1);
        }




        /* Pill Buttons */
        button {
            border-radius: 50px;
            padding: 10px 24px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #2e7d32;
            color: white;
        }

        .btn-secondary {
            background-color: #2e7d32;
            color: white;
            padding: 0 25px;
            /* Horizontal padding */
            border-radius: 50px;
            /* Pill shape */
            border: 1px solid #ccc;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            /* Stops the word 'Reset' from splitting */
            height: 46px;
            /* Matches the height of the input */
        }

        .btn-secondary:hover {
            background-color: #215d25;
            transform: translateY(-1px);
        }

        button:hover {
            background-color: #215d25;
            transform: translateY(-1px);
        }

        .event-card {
            background: #fff;
            border: 1px solid #eee;
            border-left: 6px solid #2e7d32;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.1s;
        }

        .event-card.hidden {
            display: none;
        }

        .event-info h4 {
            margin: 0 0 5px 0;
            color: #2c3e50;
        }

        .event-date {
            font-size: 0.9em;
            color: #666;
        }

        #sync-status {
            font-size: 14px;
            font-weight: bold;
            margin-right: 10px;
        }
    </style>
    <link rel="stylesheet" href="buttons.css">
</head>

<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="calendar-header">
            <h2>Club Diary</h2>
            <div>
                <span id="sync-status"></span>
                <button onclick="syncCalendar()">Sync with V1 Now</button>
            </div>
        </div>

        <div class="search-row">
            <input type="text" id="searchInput" class="search-input" placeholder="Search events..."
                onkeyup="fuzzySearch()">
            <button type="button" class="btn-secondary" onclick="resetSearch()">Reset</button>
            <select id="locationFilter" class="filter-input" aria-label="Filter by location">
                <option value="">All locations</option>
            </select>
            <label class="filter-input">From <input type="date" id="startDateFilter"></label>
            <label class="filter-input">To <input type="date" id="endDateFilter"></label>
        </div>

        <div id="calendar-list">
            <p>Loading diary...</p>
        </div>
    </div>

    <script>
        let allEvents = [];

        async function loadCalendar() {
            const res = await fetch('/api/club-calendar');
            if (!res.ok) throw new Error('Failed to load saved calendar events');
            const events = await res.json();
            if (!Array.isArray(events)) throw new Error('Invalid calendar response');

            allEvents = events;
            updateLocationFilter();
            applyFilters();
        }

        function updateLocationFilter() {
            const filter = document.getElementById('locationFilter');
            const selectedLocation = filter.value;
            const locations = [...new Set(allEvents.map(event => event.location).filter(Boolean))]
                .sort((a, b) => a.localeCompare(b));

            filter.replaceChildren(new Option('All locations', ''));
            locations.forEach(location => filter.add(new Option(location, location)));
            filter.value = locations.includes(selectedLocation) ? selectedLocation : '';
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const location = document.getElementById('locationFilter').value;
            const fromDate = document.getElementById('startDateFilter').value;
            const toDate = document.getElementById('endDateFilter').value;
            const filteredEvents = allEvents.filter(event => {
                const title = (event.title || '').toLowerCase();
                const eventLocation = event.location || '';
                const date = new Date(event.start).toISOString().slice(0, 10);

                return (!query || title.includes(query) || eventLocation.toLowerCase().includes(query)) &&
                    (!location || eventLocation === location) &&
                    (!fromDate || date >= fromDate) &&
                    (!toDate || date <= toDate);
            });

            renderEvents(filteredEvents);
        }

        function renderEvents(events) {
            const listDiv = document.getElementById('calendar-list');
            listDiv.replaceChildren();

            if (events.length === 0) {
                const emptyMessage = document.createElement('p');
                emptyMessage.textContent = allEvents.length ? 'No events match these filters.' : 'No upcoming events.';
                listDiv.appendChild(emptyMessage);
                return;
            }

            events.forEach(event => {
                const startDate = new Date(event.start).toLocaleDateString('en-GB', {
                    weekday: 'short', day: 'numeric', month: 'short'
                });

                const card = document.createElement('div');
                card.className = 'event-card';
                const info = document.createElement('div');
                info.className = 'event-info';
                const title = document.createElement('h4');
                title.textContent = event.title || 'Untitled event';
                const details = document.createElement('div');
                details.className = 'event-date';
                details.textContent = `${startDate}${event.location ? ` • ${event.location}` : ''}`;
                info.append(title, details);
                card.appendChild(info);
                listDiv.appendChild(card);
            });
        }

        function fuzzySearch() {
            applyFilters();
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('locationFilter').value = '';
            document.getElementById('startDateFilter').value = '';
            document.getElementById('endDateFilter').value = '';
            applyFilters();
            document.getElementById('searchInput').focus();
        }

        async function syncCalendar() {
            const status = document.getElementById('sync-status');
            status.textContent = 'Syncing...';

            try {
                const syncRes = await fetch('/api/club-calendar/sync', { method: 'POST' });
                if (!syncRes.ok) throw new Error('Calendar sync failed');

                await loadCalendar();
                status.textContent = 'Updated from V1';
            } catch (err) {
                console.error('Calendar sync failed:', err);
                try {
                    await loadCalendar();
                    status.textContent = 'Sync failed; showing saved events';
                } catch (loadErr) {
                    console.error('Calendar load failed:', loadErr);
                    status.textContent = 'Unable to load calendar';
                }
            }

            setTimeout(() => {
                if (status.textContent !== 'Syncing...') status.textContent = '';
            }, 5000);
        }

        document.getElementById('locationFilter').addEventListener('change', applyFilters);
        document.getElementById('startDateFilter').addEventListener('change', applyFilters);
        document.getElementById('endDateFilter').addEventListener('change', applyFilters);
        syncCalendar();

    </script>
</body>

</html>
