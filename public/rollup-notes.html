<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rollup Event Notes Management</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #ddd;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .full-width {
            grid-column: span 2;
        }

        label {
            font-weight: bold;
            font-size: 0.85em;
            display: block;
            margin-bottom: 5px;
            color: #444;
        }

        input,
        select,
        textarea {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-save {
            background: #2e7d32;
            color: white;
        }

        .btn-cancel {
            background: #6c757d;
            color: white;
            margin-left: 10px;
        }

        .btn-edit {
            background: #007bff;
            color: white;
            padding: 6px 12px;
            font-size: 0.85em;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
            padding: 6px 12px;
            font-size: 0.85em;
            margin-left: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
            font-size: 0.9em;
        }

        th {
            background-color: #eef2f7;
        }

        .hidden {
            display: none;
        }

        .note-badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8em;
        }
    </style>
</head>

<body>
    <div id="nav-placeholder"></div>

    <!-- BANNER DISPLAY FOR ROLLUP CONSTRUCTION PAGE -->
    <div id="eventNotesBanner" class="hidden"
        style="background-color: #e8f5e9; border: 2px solid #2e7d32; border-radius: 8px; padding: 15px; margin-bottom: 20px;">
        <h3 style="margin-top: 0; color: #2e7d32; display: flex; align-items: center; gap: 8px;">
            📌 Active Event Notes for Selected Date
        </h3>
        <div id="eventNotesContent"></div>
    </div>

    <div class="container">
        <h1>Rollup Event Notes</h1>

        <!-- ADD / EDIT FORM CARD -->
        <div class="card">
            <h3 id="formTitle">Add Event Note</h3>
            <form id="noteForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="noteId">
                <div class="form-grid">
                    <div>
                        <label>Requested By:</label>
                        <input type="text" id="requestedBy" list="golferList"
                            placeholder="Select Golfer or type custom name..." required>
                        <datalist id="golferList"></datalist>
                    </div>
                    <div><!-- Spacer --></div>
                    <div>
                        <label>Effective From:</label>
                        <input type="date" id="dateFrom" onchange="syncToDate()" required>
                    </div>
                    <div>
                        <label>Effective To:</label>
                        <input type="date" id="dateTo" required>
                    </div>
                    <div class="full-width">
                        <label>Note Content / Details:</label>
                        <textarea id="content" rows="3"
                            placeholder="e.g. Greens being hollow-tined, maintenance starting 8am..."
                            required></textarea>
                    </div>
                </div>
                <div style="margin-top: 15px;">
                    <button type="submit" class="btn-save" id="saveBtn">Save Event Note</button>
                    <button type="button" class="btn-cancel hidden" id="cancelBtn" onclick="resetForm()">Cancel
                        Edit</button>
                </div>
            </form>
        </div>

        <!-- EXISTING NOTES TABLE -->
        <h3>Existing Event Notes</h3>
        <table id="notesTable">
            <thead>
                <tr>
                    <th>Created</th>
                    <th>Requested By</th>
                    <th>Date Window</th>
                    <th>Details</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script src="js/shared.js?v=1.1"></script>
    <script>
        let allNotes = [];

        window.addEventListener('DOMContentLoaded', () => {
            loadGolfersDatalist();
            loadNotes();
            fetch('nav.html').then(r => r.text()).then(d => document.getElementById('nav-placeholder').innerHTML = d);
        });

        async function loadGolfersDatalist() {
            try {
                const res = await fetch('/api/golfers');
                const golfers = await res.json();
                const list = document.getElementById('golferList');
                golfers.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.name;
                    list.appendChild(opt);
                });
            } catch (e) { console.error("Error loading golfer list:", e); }
        }

        async function loadNotes() {
            try {
                const res = await fetch('/api/rollup-notes');
                allNotes = await res.json();
                renderTable();
            } catch (e) { console.error("Error loading notes:", e); }
        }

        function syncToDate() {
            const fromVal = document.getElementById('dateFrom').value;
            const toInput = document.getElementById('dateTo');
            toInput.min = fromVal;
            if (!toInput.value || toInput.value < fromVal) {
                toInput.value = fromVal;
            }
        }

        function renderTable() {
            const tbody = document.querySelector('#notesTable tbody');
            tbody.innerHTML = '';

            if (allNotes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No event notes recorded yet.</td></tr>';
                return;
            }

            allNotes.forEach(n => {
                const row = document.createElement('tr');
                const createdStr = new Date(n.created_at).toLocaleDateString('en-GB');
                const fromStr = new Date(n.date_from).toLocaleDateString('en-GB');
                const toStr = new Date(n.date_to).toLocaleDateString('en-GB');

                row.innerHTML = `
                    <td>${createdStr}</td>
                    <td><strong>${n.requested_by}</strong></td>
                    <td><span class="note-badge">${fromStr} — ${toStr}</span></td>
                    <td>${n.content}</td>
                    <td>
                        <button class="btn-edit" onclick="editNote('${n._id}')">Edit</button>
                        <button class="btn-delete" onclick="deleteNote('${n._id}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('noteId').value;
            const requested_by = document.getElementById('requestedBy').value;
            const date_from = document.getElementById('dateFrom').value;
            const date_to = document.getElementById('dateTo').value;
            const content = document.getElementById('content').value;

            const payload = { requested_by, date_from, date_to, content };
            const url = id ? `/api/rollup-notes/${id}` : '/api/rollup-notes';
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    resetForm();
                    loadNotes();
                } else {
                    alert("Failed to save note.");
                }
            } catch (err) { alert("Network error saving note."); }
        }

        function editNote(id) {
            const note = allNotes.find(n => n._id === id);
            if (!note) return;

            document.getElementById('noteId').value = note._id;
            document.getElementById('requestedBy').value = note.requested_by;
            document.getElementById('dateFrom').value = note.date_from.split('T')[0];
            document.getElementById('dateTo').value = note.date_to.split('T')[0];
            document.getElementById('content').value = note.content;

            document.getElementById('formTitle').textContent = "Edit Event Note";
            document.getElementById('saveBtn').textContent = "Update Event Note";
            document.getElementById('cancelBtn').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('noteId').value = '';
            document.getElementById('noteForm').reset();
            document.getElementById('formTitle').textContent = "Add Event Note";
            document.getElementById('saveBtn').textContent = "Save Event Note";
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        async function deleteNote(id) {
            if (!confirm("Are you sure you want to delete this event note?")) return;
            try {
                const res = await fetch(`/api/rollup-notes/${id}`, { method: 'DELETE' });
                if (res.ok) loadNotes();
            } catch (e) { alert("Delete failed."); }
        }

        async function fetchRollupNotesForDate(dateStr) {
            const banner = document.getElementById('eventNotesBanner');
            const contentDiv = document.getElementById('eventNotesContent');
            if (!banner || !contentDiv) return;

            try {
                const res = await fetch(`/api/rollup-notes/check-date?date=${dateStr}`);
                const notes = await res.json();

                if (notes && notes.length > 0) {
                    let html = '<ul style="margin: 0; padding-left: 20px;">';
                    notes.forEach(n => {
                        html += `<li style="margin-bottom: 8px;">
                    <strong>[Requested by ${n.requested_by}]:</strong> ${n.content}
                </li>`;
                    });
                    html += '</ul>';
                    contentDiv.innerHTML = html;
                    banner.classList.remove('hidden');
                } else {
                    banner.classList.add('hidden');
                    contentDiv.innerHTML = '';
                }
            } catch (err) {
                console.error("Error checking date notes:", err);
            }
        }
    </script>
</body>

</html>
