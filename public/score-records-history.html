<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competition Score History</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); }
        h1 { margin-top: 0; color: #2c3e50; }
        .filter-card { background: #eef2f7; padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #d1d9e6; }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; align-items: end; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 0.85em; font-weight: bold; color: #444; margin-bottom: 5px; }
        input, select { padding: 9px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; font-family: inherit; background-color: #fff; box-sizing: border-box; }
        .button-row { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .btn { padding: 8px 16px; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; font-size: 0.85em; }
        .btn:hover { opacity: 0.9; }
        .btn-reset { background-color: #6c757d; color: white; }
        .btn-edit { background-color: #0288d1; color: white; margin-right: 5px; }
        .btn-delete { background-color: #d32f2f; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px 12px; text-align: left; font-size: 14px; }
        th { background-color: #2e7d32; color: white; font-weight: 600; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .score-val { font-weight: bold; color: #2e7d32; }
        #toast-msg { min-height: 20px; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <h1>Competition Score History</h1>
        <div id="toast-msg"></div>

        <!-- FILTER CONTROLS -->
        <div class="filter-card">
            <div class="filter-grid">
                <div class="form-group">
                    <label for="filterComp">Competition Name:</label>
                    <select id="filterComp" onchange="applyFilters()">
                        <option value="">All Competitions</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="filterScoreType">Format:</label>
                    <select id="filterScoreType" onchange="applyFilters()">
                        <option value="">All Formats</option>
                        <option value="stableford">Stableford</option>
                        <option value="net">Net</option>
                        <option value="gross">Gross</option>
                    </select>
                </div>
            </div>
            <div class="button-row">
                <button class="btn btn-reset" onclick="resetFilters()">Reset Filters</button>
            </div>
        </div>

        <!-- SCORES TABLE -->
        <table id="scoresTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Competition</th>
                    <th>Format</th>
                    <th>Players</th>
                    <th>Overall Score</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        let allRecords = [];

        window.addEventListener('DOMContentLoaded', async () => {
            await loadDropdownOptions();
            await loadScoreRecords();
        });

        function showToast(text, isError = false) {
            const msg = document.getElementById("toast-msg");
            if (!msg) return alert(text);
            msg.textContent = text;
            msg.style.color = isError ? "#d32f2f" : "#2e7d32";
            setTimeout(() => { msg.textContent = ""; }, 4000);
        }

        async function loadDropdownOptions() {
            try {
                const res = await fetch('/api/score-records/setup-data');
                if (!res.ok) throw new Error("Failed to load options");
                const data = await res.json();

                const compSelect = document.getElementById('filterComp');
                compSelect.innerHTML = '<option value="">All Competitions</option>';

                (data.competitions || []).forEach(name => {
                    const opt1 = document.createElement('option');
                    opt1.value = name; opt1.textContent = name;
                    compSelect.appendChild(opt1);
                });
            } catch (err) {
                showToast("Could not load dropdown options.", true);
            }
        }

        async function loadScoreRecords() {
            try {
                const res = await fetch('/api/score-records');
                if (!res.ok) throw new Error("Failed to fetch score records");
                const rawData = await res.json();

                // SORT BY DATE (Newest first)
                allRecords = rawData.sort((a, b) => new Date(b.date) - new Date(a.date));

                applyFilters();
            } catch (err) {
                showToast("Failed to load score history.", true);
            }
        }

        function applyFilters() {
            const compName = document.getElementById('filterComp').value;
            const scoreType = document.getElementById('filterScoreType').value;

            let filtered = allRecords.filter(rec => {
                if (compName && rec.competition_name !== compName) return false;
                if (scoreType && rec.score_type !== scoreType) return false;
                return true;
            });

            renderTable(filtered);
        }

        function renderTable(data) {
            const tbody = document.querySelector('#scoresTable tbody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888;">No score records found.</td></tr>`;
                return;
            }

            data.forEach(rec => {
                const d = new Date(rec.date).toLocaleDateString('en-GB', {
                    weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
                });
                const playerNames = (rec.players || []).map(p => p.name).join(', ');

                tbody.innerHTML += `
                    <tr>
                        <td>${d}</td>
                        <td><strong>${rec.competition_name}</strong></td>
                        <td>${rec.score_type}</td>
                        <td>${playerNames}</td>
                        <td class="score-val">${Number(rec.overall_score).toFixed(2)}</td>
                        <td>
                            <button class="btn btn-delete" onclick="deleteRecord('${rec._id}')">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function deleteRecord(id) {
            if (!confirm("Are you sure you want to delete this score record?")) return;

            try {
                const res = await fetch(`/api/score-records/${id}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!res.ok) throw new Error("Delete failed");
                showToast("Record deleted successfully!");
                await loadScoreRecords();
            } catch (err) {
                showToast("Error: " + err.message, true);
            }
        }

        function resetFilters() {
            document.getElementById('filterComp').value = '';
            document.getElementById('filterScoreType').value = '';
            applyFilters();
        }

        fetch('nav.html')
            .then(res => res.text())
            .then(data => { document.getElementById('nav-placeholder').innerHTML = data; })
            .catch(() => {});
    </script>
</body>
</html>
